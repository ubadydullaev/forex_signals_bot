
name: BiQuote API Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biquote-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Test BiQuote market data API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run BiQuote diagnostic
        run: python scripts/diagnose_biquote.py
        
