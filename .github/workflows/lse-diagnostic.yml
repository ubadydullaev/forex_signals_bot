
name: LSE Data Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lse-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Test LSE market data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run LSE diagnostic
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/diagnose_lse.py
