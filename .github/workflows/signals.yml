
name: Forex M30 Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: forex-m30-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: .signal_state.json
          key: forex-signal-state-${{ github.run_id }}
          restore-keys: |
            forex-signal-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan markets and send signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save signal state
        if: always() && hashFiles('.signal_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .signal_state.json
          key: forex-signal-state-${{ github.run_id }}
          
