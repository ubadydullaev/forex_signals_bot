
name: ForexSB Data Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check all native ForexSB timeframes
        run: |
          python - <<'PY'
          import gzip
          import json
          import struct
          import urllib.request
          from datetime import datetime, timedelta, timezone

          BASE = "https://data.forexsb.com/datafeed"
          EPOCH = datetime(2000, 1, 1, tzinfo=timezone.utc)
          SYMBOLS = ["XAUUSD", "XAGUSD", "EURUSD", "GBPUSD"]
          PERIODS = {
              "M15": ("m15", 15),
              "M30": ("m30", 30),
              "H1": ("h1", 60),
              "H4": ("h4", 240),
              "D1": ("d1", 1440),
          }

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          print("Metadata yuklanmoqda...")
          metadata = json.loads(gzip.decompress(
              download(BASE + "/info/premium.json.gz")
          ))

          now = datetime.now(timezone.utc)
          total = 0

          for symbol in SYMBOLS:
              info = metadata.get(symbol)
              if not isinstance(info, dict):
                  raise RuntimeError(f"{symbol}: metadata topilmadi")

              scale = float(info["priceScale"])
              print(f"\n--- {symbol} | priceScale={scale} ---")

              for timeframe, (period, minutes) in PERIODS.items():
                  url = (
                      f"{BASE}/data/dukascopy/"
                      f"{symbol}{period}.lb.gz"
                  )

                  try:
                      raw = gzip.decompress(download(url))
                  except Exception as error:
                      raise RuntimeError(
                          f"{symbol} {timeframe}: yuklash xatosi: {error}"
                      )

                  if not raw or len(raw) % 28 != 0:
                      raise RuntimeError(
                          f"{symbol} {timeframe}: binary format noto'g'ri"
                      )

                  rows = []
                  for offset in range(0, len(raw), 28):
                      values = struct.unpack_from("<7i", raw, offset)
                      minute, op, hi, lo, cl, volume, spread = values
                      stamp = EPOCH + timedelta(minutes=minute)

                      if stamp + timedelta(minutes=minutes) > now:
                          continue

                      o, h, l, c = (
                          op / scale, hi / scale,
                          lo / scale, cl / scale
                      )

                      if (
                          l > 0 and h >= l
                          and l <= o <= h
                          and l <= c <= h
                      ):
                          rows.append(stamp)

                  rows.sort()
                  if len(rows) < 220:
                      raise RuntimeError(
                          f"{symbol} {timeframe}: "
                          f"{len(rows)}/220 sham"
                      )

                  age = now - rows[-1]
                  if age > timedelta(days=3):
                      raise RuntimeError(
                          f"{symbol} {timeframe}: "
                          f"ma'lumot eskirgan: {age}"
                      )

                  print(
                      f"OK {symbol} {timeframe}: "
                      f"{len(rows)} sham | oxirgisi {rows[-1]}"
                  )
                  total += 1

          print(f"\nSUCCESS: {total}/20 native timeframe tekshiruvi o'tdi.")
          PY
