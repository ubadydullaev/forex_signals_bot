
name: ForexSB Data Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check ForexSB data source
        run: |
          python - <<'PY'
          import gzip
          import json
          import struct
          import urllib.request
          from datetime import datetime, timedelta, timezone

          BASE = "https://data.forexsb.com/datafeed"
          EPOCH = datetime(2000, 1, 1, tzinfo=timezone.utc)
          SYMBOLS = ["XAUUSD", "XAGUSD", "EURUSD", "GBPUSD"]

          def download(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status}")
                  return response.read()

          print("1. Metadata yuklanmoqda...")
          metadata_raw = gzip.decompress(
              download(BASE + "/info/premium.json.gz")
          )
          metadata = json.loads(metadata_raw)

          now = datetime.now(timezone.utc)
          results = {}

          def parse_file(symbol, period):
              url = (
                  f"{BASE}/data/dukascopy/"
                  f"{symbol}{period}.lb.gz"
              )
              raw = gzip.decompress(download(url))

              if len(raw) == 0 or len(raw) % 28 != 0:
                  raise RuntimeError(
                      f"{symbol} {period}: binary hajmi noto'g'ri"
                  )

              info = metadata.get(symbol)
              if not isinstance(info, dict):
                  raise RuntimeError(
                      f"{symbol}: metadata topilmadi"
                  )

              scale = float(info["priceScale"])
              candles = []

              for offset in range(0, len(raw), 28):
                  minutes, op, hi, lo, cl, vol, spread = (
                      struct.unpack_from("<7i", raw, offset)
                  )

                  timestamp = EPOCH + timedelta(minutes=minutes)

                  candle = {
                      "time": timestamp,
                      "open": op / scale,
                      "high": hi / scale,
                      "low": lo / scale,
                      "close": cl / scale,
                      "volume": max(0, vol),
                  }

                  if (
                      candle["low"] > 0
                      and candle["high"] >= candle["low"]
                      and candle["low"] <= candle["open"] <= candle["high"]
                      and candle["low"] <= candle["close"] <= candle["high"]
                      and timestamp <= now
                  ):
                      candles.append(candle)

              candles.sort(key=lambda x: x["time"])
              return candles

          def aggregate(candles, minutes):
              duration = timedelta(minutes=minutes)
              groups = {}

              for candle in candles:
                  timestamp = candle["time"]
                  seconds = int(timestamp.timestamp())
                  bucket = seconds // int(duration.total_seconds())

                  groups.setdefault(bucket, []).append(candle)

              result = []

              for bucket in sorted(groups):
                  rows = groups[bucket]
                  start = datetime.fromtimestamp(
                      bucket * int(duration.total_seconds()),
                      tz=timezone.utc
                  )

                  if start + duration > now:
                      continue

                  result.append({
                      "time": start,
                      "open": rows[0]["open"],
                      "high": max(x["high"] for x in rows),
                      "low": min(x["low"] for x in rows),
                      "close": rows[-1]["close"],
                      "volume": sum(x["volume"] for x in rows),
                  })

              return result

          def check_count(symbol, timeframe, candles, minutes):
              closed = [
                  c for c in candles
                  if c["time"] + timedelta(minutes=minutes) <= now
              ]

              if len(closed) < 220:
                  raise RuntimeError(
                      f"{symbol} {timeframe}: "
                      f"faqat {len(closed)}/220 sham"
                  )

              latest = closed[-1]["time"]
              age = now - latest

              if age > timedelta(days=3):
                  raise RuntimeError(
                      f"{symbol} {timeframe}: "
                      f"ma'lumot eskirgan ({age})"
                  )

              print(
                  f"OK {symbol} {timeframe}: "
                  f"{len(closed)} sham | oxirgisi: {latest}"
              )

          for symbol in SYMBOLS:
              print(f"\n--- {symbol} ---")

              m15 = parse_file(symbol, 15)
              m30 = parse_file(symbol, 30)

              check_count(symbol, "M15", m15, 15)
              check_count(symbol, "M30", m30, 30)

              for timeframe, minutes in [
                  ("H1", 60),
                  ("H4", 240),
                  ("D1", 1440),
              ]:
                  candles = aggregate(m30, minutes)
                  check_count(
                      symbol,
                      timeframe,
                      candles,
                      minutes
                  )

          print("\nSUCCESS: ForexSB barcha tekshiruvlardan o'tdi.")
          PY
          
