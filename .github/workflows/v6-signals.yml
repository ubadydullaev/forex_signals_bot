
name: Forex V6 Signals

on:
  workflow_dispatch:
    inputs:
      telegram_self_test:
        description: "Faqat admin chatiga Telegram test xabari"
        required: true
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: forex-v6-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dukascopy
        run: npm install --no-save dukascopy-node

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check V6 syntax
        run: python -m compileall -q v6

      - name: Run V6 tests
        run: python -m unittest discover -s tests -p "test_v6_*.py" -v

      - name: Run V6 analysis
        env:
          V6_ENABLE_TELEGRAM: "true"
          V6_TELEGRAM_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_self_test || false }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        run: python -m v6.runner
