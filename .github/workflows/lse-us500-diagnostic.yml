
name: LSE US500 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run US500 diagnostic
        env:
          LSE_API_KEY: ${{ secrets.LSE_API_KEY }}
        run: |
          python scripts/diagnose_lse_us500.py
          
