
name: V6 Full Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dukascopy
        run: npm install --no-save dukascopy-node

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check V6 Python syntax
        run: python -m compileall -q v6 tests

      - name: Run V6 indicator unit tests
        run: python -m unittest discover -s tests -p "test_v6_*.py" -v

      - name: Test all V6 instruments and timeframes
        run: |
          python - <<'PY'
          from v6.data_adapter import get_market_data
          from v6.config import SYMBOLS, TIMEFRAMES

          passed = []
          failed = []

          for symbol in SYMBOLS:
              for timeframe in TIMEFRAMES:
                  print(f"\nTesting {symbol} {timeframe}...", flush=True)

                  try:
                      market = get_market_data(
                          symbol=symbol,
                          timeframe=timeframe,
                          limit=250,
                      )

                      assert len(market.candles) >= 220, (
                          f"Not enough candles: {len(market.candles)}"
                      )

                      assert all(c.is_closed for c in market.candles), (
                          "Unclosed candle found"
                      )

                      assert all(c.source != "unknown" for c in market.candles), (
                          "Unknown data source"
                      )

                      print("Candles:", len(market.candles))
                      print("Source:", market.candles[-1].source)
                      print("Last candle closed:", market.candles[-1].is_closed)

                      passed.append(f"{symbol} {timeframe}")
                      print("RESULT: PASSED", flush=True)

                  except Exception as error:
                      failed.append((symbol, timeframe, str(error)))
                      print("RESULT: FAILED", error, flush=True)

          print("\n========== V6 FULL TEST SUMMARY ==========")
          print("Passed:", len(passed))
          print("Failed:", len(failed))

          if failed:
              print("\nFAILED TESTS:")
              for symbol, timeframe, error in failed:
                  print(f"{symbol} {timeframe}: {error}")

              raise SystemExit("V6 VALIDATION FAILED")

          print("\nALL 35 DATA TESTS PASSED")
          PY
