
name: V6 Historical Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dukascopy
        run: npm install --no-save dukascopy-node

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check V6 syntax
        run: python -m compileall -q v6 tests

      - name: Run V6 automated tests
        run: python -m unittest discover -s tests -v

      - name: Run V6 historical backtest
        run: python -m v6.backtest

      - name: Run V6 cost analysis
        run: python -m v6.cost_report

      - name: Upload V6 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-backtest-results
          path: |
            backtest_results/
            v6/broker_costs.csv
          if-no-files-found: warn
          retention-days: 30
